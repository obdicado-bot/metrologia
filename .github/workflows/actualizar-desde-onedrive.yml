name: Actualizar Metrología desde OneDrive

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Enlace de descarga del archivo HTML en OneDrive
        required: true
        type: string
  repository_dispatch:
    types: [actualizar-metrologia]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Descargar HTML desde OneDrive
        env:
          SOURCE_URL: ${{ inputs.source_url || github.event.client_payload.source_url }}
        run: |
          test -n "$SOURCE_URL" || { echo "Falta source_url"; exit 1; }
          curl --fail --location --retry 3 --retry-all-errors "$SOURCE_URL" --output index.html
          test -s index.html || { echo "El archivo descargado está vacío"; exit 1; }
          grep -qi '<html' index.html || { echo "El enlace no descargó un archivo HTML"; exit 1; }
      - name: Publicar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "No hay cambios para publicar"; exit 0; }
          git commit -m "Actualizar tablero desde OneDrive"
          git push
